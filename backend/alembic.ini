# Alembic configuration. Run every alembic command from the backend/ directory.
# The database URL is not set here: env.py takes it from DATABASE_URL (see app/config.py).

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# New migration files are named like 20261110_ab12cd34ef56_add_something.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
